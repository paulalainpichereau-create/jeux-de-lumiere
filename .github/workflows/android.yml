name: App Android

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Upload key (repository secrets, when they exist)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "::notice::Signed with the upload key: the .aab can go to the Play Store."
          else
            echo "::notice::No upload key in the secrets: signed with a test key (fine to try the app, not for the Play Store)."
          fi
      - name: Build (APK to try, AAB for the Play Store)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          gradle --no-daemon assembleRelease bundleRelease > build.log 2>&1 || true
          grep -E "^e: |error:|FAILURE|What went wrong|> " build.log | sort -u | head -n 40 | while IFS= read -r line; do echo "::error::$line"; done
          tail -n 15 build.log
          grep -q "BUILD SUCCESSFUL" build.log
      - name: Collect
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/JeuxDeLumiere.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/JeuxDeLumiere-PlayStore.aab
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: JeuxDeLumiere-android
          path: out/*
      # also attached to a fixed release, so the APK can be downloaded on a phone with a plain link
      - name: Publish to the "android" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || \
            gh release create android --title "App Android" --prerelease \
              --notes "JeuxDeLumiere.apk : à installer directement sur un téléphone Android pour essayer. JeuxDeLumiere-PlayStore.aab : le fichier à envoyer sur la Google Play Console."
          gh release upload android out/JeuxDeLumiere.apk out/JeuxDeLumiere-PlayStore.aab --clobber

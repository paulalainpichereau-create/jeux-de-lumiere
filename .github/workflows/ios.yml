name: App iPhone

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project JeuxDeLumiere.xcodeproj -target JeuxDeLumiere -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 60
          test "${PIPESTATUS[0]}" -eq 0
      - name: Package as .ipa
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Release-iphoneos/JeuxDeLumiere.app Payload/
          ls Payload/JeuxDeLumiere.app/PlugIns
          zip -qry JeuxDeLumiere-non-signe.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: JeuxDeLumiere-non-signe
          path: ios/JeuxDeLumiere-non-signe.ipa
      # also attach it to a fixed release, so it can be downloaded with a plain link
      - name: Publish to the "prototype-iphone" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view prototype-iphone >/dev/null 2>&1 || \
            gh release create prototype-iphone --title "App iPhone" --prerelease \
              --notes "Application iPhone (version de test), non signée : à installer avec Sideloadly ou AltStore (voir ios/INSTALLATION.md)."
          gh release upload prototype-iphone ios/JeuxDeLumiere-non-signe.ipa --clobber

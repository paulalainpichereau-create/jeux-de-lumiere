name: App iPhone

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project and install Google Cast
        run: |
          brew install xcodegen
          cd ios && xcodegen generate && pod install --repo-update
      - name: Build (unsigned)
        env:
          # Cast receiver application ID from the Google Cast SDK Developer Console (repository variable)
          CAST_APP_ID: ${{ vars.CAST_APP_ID || 'CC1AD845' }}
        run: |
          cd ios
          xcodebuild -workspace JeuxDeLumiere.xcworkspace -scheme JeuxDeLumiere -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CAST_APP_ID="$CAST_APP_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 || true
          # compiler errors become annotations, readable through the GitHub API
          grep -E "error:" build.log | sort -u | head -n 40 | while IFS= read -r line; do echo "::error::$line"; done
          tail -n 5 build.log
          grep -q "BUILD SUCCEEDED" build.log
      - name: Package as .ipa
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/JeuxDeLumiere.app Payload/
          ls Payload/JeuxDeLumiere.app/PlugIns
          echo "::notice::Frameworks: $(ls Payload/JeuxDeLumiere.app/Frameworks 2>/dev/null | tr '\n' ' ')"
          echo "::notice::Cast app ID: $(/usr/libexec/PlistBuddy -c 'Print :JDLCastAppID' Payload/JeuxDeLumiere.app/Info.plist)"
          zip -qry JeuxDeLumiere-non-signe.ipa Payload
      # App Store: only when the Apple keys are in the repository secrets (see stores/GUIDE.md).
      # Xcode signs automatically with the App Store Connect API key, then sends the build to App Store Connect
      # (it shows up in TestFlight, then can be submitted for review).
      - name: Send to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CAST_APP_ID: ${{ vars.CAST_APP_ID || 'CC1AD845' }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$TEAM_ID" ]; then
            echo "::notice::No Apple keys in the secrets yet: the App Store step is skipped."
            exit 0
          fi
          cd ios
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/asc.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -workspace JeuxDeLumiere.xcworkspace -scheme JeuxDeLumiere -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/JeuxDeLumiere.xcarchive archive \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CAST_APP_ID="$CAST_APP_ID" $AUTH > archive.log 2>&1 || true
          grep -E "error:" archive.log | sort -u | head -n 40 | while IFS= read -r line; do echo "::error::$line"; done
          tail -n 5 archive.log
          grep -q "ARCHIVE SUCCEEDED" archive.log
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/JeuxDeLumiere.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export $AUTH > export.log 2>&1 || true
          grep -E "error:|Error" export.log | sort -u | head -n 40 | while IFS= read -r line; do echo "::error::$line"; done
          tail -n 8 export.log
          grep -q -E "EXPORT SUCCEEDED|Upload succeeded" export.log
          echo "::notice::Build ${{ github.run_number }} sent to App Store Connect: it appears in TestFlight after Apple's processing (about 15 minutes)."
      - uses: actions/upload-artifact@v4
        with:
          name: JeuxDeLumiere-non-signe
          path: ios/JeuxDeLumiere-non-signe.ipa
      # also attach it to a fixed release, so it can be downloaded with a plain link
      - name: Publish to the "prototype-iphone" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view prototype-iphone >/dev/null 2>&1 || \
            gh release create prototype-iphone --title "App iPhone" --prerelease \
              --notes "Application iPhone (version de test), non signée : à installer avec Sideloadly ou AltStore (voir ios/INSTALLATION.md)."
          gh release upload prototype-iphone ios/JeuxDeLumiere-non-signe.ipa --clobber

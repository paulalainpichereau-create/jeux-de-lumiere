# XcodeGen spec: `xcodegen generate` turns this into JeuxDeLumiere.xcodeproj (done by the GitHub workflow).
name: JeuxDeLumiere
options:
  bundleIdPrefix: fr.jeuxdelumiere
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3"
    CURRENT_PROJECT_VERSION: "3"
targets:
  JeuxDeLumiere:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jeuxdelumiere.app
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CAST_APP_ID: CC1AD845   # replaced at build time by the repository variable CAST_APP_ID
    dependencies:
      - target: Broadcast
        embed: true
    scheme: {}
  Broadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jeuxdelumiere.app.broadcast
        INFOPLIST_FILE: Broadcast/Info.plist
